version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: glowtrack-postgres
    environment:
      POSTGRES_DB: glowtrack_db
      POSTGRES_USER: glowtrack
      POSTGRES_PASSWORD: glowtrack_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U glowtrack']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
