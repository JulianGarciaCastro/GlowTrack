version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: glowtrack-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: glowtrack_db
      MYSQL_USER: glowtrack
      MYSQL_PASSWORD: glowtrack_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
